services:
  app:
    build: .
    image: ai-interface:local
    init: true
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${APP_BIND_ADDRESS}:${APP_PORT}:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s
